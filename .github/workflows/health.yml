name: health
# Daily black-box probe of the serving stack at bioconductor.org.
# The badge on this workflow is the status light: red means a probe failed.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage responds
        run: curl -fsS -o /dev/null https://bioconductor.org/

      - name: Release PACKAGES index is served (the BiocManager path)
        run: |
          curl -fsS https://bioconductor.org/packages/release/bioc/src/contrib/PACKAGES \
            | head -c 200 | grep -q '^Package:'

      - name: Symlink resolution works (packages/release is not a real key)
        run: curl -fsS -o /dev/null https://bioconductor.org/packages/release/bioc/html/BiocGenerics.html

      - name: Range requests return 206
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-99 \
            https://bioconductor.org/packages/release/bioc/src/contrib/PACKAGES.gz)
          test "$code" = 206

      - name: Mirror manifest API is up
        run: |
          curl -fsS https://bioconductor.org/api/v1/manifest/index.json \
            | jq -e '.versions | length > 0' > /dev/null
      - name: Missing pages get the site's 404 page, not a bare "Not Found"
        run: |
          code=$(curl -s -o page.html -w '%{http_code}' https://bioconductor.org/no-such-page-health-probe)
          test "$code" = 404 && grep -q '<title>' page.html
