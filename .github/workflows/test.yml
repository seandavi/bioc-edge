name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22.18+ strips TypeScript types natively, which is why worker/
      # has no package.json, no node_modules and no build step. Pinning the
      # major matters: on older Node `node --test worker/test.ts` fails to
      # parse rather than failing a test, which reads as a broken suite.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The gate that would have caught the 12-minute bioc-dev outage on
      # 2026-07-30. logQuery() was used in index.ts but never imported -- the
      # unit tests still passed, because they exercise keys.ts where it is
      # correctly exported, and `wrangler deploy` still succeeded, because
      # esbuild strips types without resolving whether a name is bound. Only a
      # real typecheck reports it: TS2304 Cannot find name 'logQuery'.
      - name: worker typecheck
        working-directory: worker
        run: npm install --no-audit --no-fund && npm run typecheck

      - name: worker key mapping and link resolution
        run: node --test worker/test.ts

      # The release-roll guard is inert and fires roughly twice a year, so a
      # break in it surfaces six months after it ships unless CI holds it.
      - name: release-roll guard logic
        run: node --test worker/test-release-roll.ts

      # Exercises real rsync, no network: builds fixture trees, runs the
      # itemize parsing and the scope filter against them. The filter is the
      # one that fails quietly in both directions -- dropping wanted content,
      # or silently pulling 2.3M unwanted objects.
      - name: rsync itemize parsing and scope filter
        run: ./test-itemize.sh

      - name: shell syntax
        run: for f in *.sh inventory/*.sh; do bash -n "$f"; done
